        <div id="map" style="height: 400px;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([42.87, 74.60], 12);

// слой карты
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
  .addTo(map);

// сюда будем складывать маркеры автобусов
let markers = {};

// функция обновления (берём данные с API)
async function updateBuses() {
    const res = await fetch('URL_С_API_АВТОБУСОВ'); // <-- сюда реальный API
    const data = await res.json();

    data.buses.forEach(bus => {
        const id = bus.id;
        const lat = bus.lat;
        const lon = bus.lon;

        if (!markers[id]) {
            markers[id] = L.marker([lat, lon]).addTo(map);
        } else {
            markers[id].setLatLng([lat, lon]);
        }
    });
}

// обновляем каждые 5 секунд
setInterval(updateBuses, 5000);
</script>
